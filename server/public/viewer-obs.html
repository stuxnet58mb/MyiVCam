<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Viewer OBS</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; }
  video { width:100vw; height:100vh; object-fit:contain; background:#000; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<script src="/socket.io/socket.io.js"></script>
<script>
const v = document.getElementById('v');
const socket = io();
let pc;

function setupPC() {
  pc = new RTCPeerConnection();
  pc.ontrack = ev => {
    v.srcObject = ev.streams[0];
    v.muted = false;
    v.play().catch(()=>{});
  };
  pc.onicecandidate = ev => {
    if (ev.candidate) {
      socket.emit('webrtc-ice', {
        candidate: ev.candidate.candidate,
        sdpMLineIndex: ev.candidate.sdpMLineIndex,
        sdpMid: ev.candidate.sdpMid
      });
    }
  };
}

socket.on('webrtc-offer', async data => {
  if (!pc) setupPC();
  try {
    await pc.setRemoteDescription({ type: 'offer', sdp: data.sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('webrtc-answer', { sdp: answer.sdp });
  } catch (e) {
    console.error('Answer error', e);
  }
});

socket.on('webrtc-ice', async data => {
  if (!pc) return;
  try {
    await pc.addIceCandidate({ candidate: data.candidate, sdpMLineIndex: data.sdpMLineIndex, sdpMid: data.sdpMid });
  } catch(e) { console.error('ICE add error', e); }
});
</script>
</body>
</html>
